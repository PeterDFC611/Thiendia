<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiên Địa - Dự Đoán Tương Lai</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- BẢNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Đăng Nhập</h2>
            <p class="auth-sub">Đăng nhập để xem dự đoán tương lai của bạn</p>
            
            <input type="text" id="username-input" placeholder="Nhập tên tài khoản..." autocomplete="off" />
            <input type="password" id="password-input" placeholder="Nhập mật khẩu..." />
            
            <button id="auth-btn" onclick="handleAuth()">Đăng Nhập</button>
            
            <p id="toggle-text">
                Chưa có tài khoản? <a href="#" onclick="toggleAuthMode()">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH (Ẩn khi chưa đăng nhập) -->
    <div id="main-content" style="display: none;">
        <header class="navbar">
            <div class="logo">Thiên Địa</div>
            <div class="user-info">
                <span>Xin chào, <strong id="user-display-name">Khách</strong>!</span>
                <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
            </div>
        </header>

        <main class="container">
            <section class="welcome-section">
                <h1>Dự Đoán Tương Lai Của Bạn</h1>
                <p>Chào mừng <span class="highlight-user" id="welcome-user-name">bạn</span> đã đến với Thiên Địa. Hãy khám phá những bí mật tương lai dành riêng cho bạn!</p>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
